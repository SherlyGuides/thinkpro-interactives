<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThinkPro Interactives</title>
<style>
:root{--bg:#2E3846;--card:#3C4B5C;--ink:#fff;--dim:rgba(255,255,255,.62);--orange:#F28C3E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:56px 16px}
